# Secret scanning with Gitleaks (https://github.com/gitleaks/gitleaks-action).
# On pull requests it scans ONLY the PR's own commits (gitleaks-action builds the
# `<first PR commit>^..<last PR commit>` range) and runs gitleaks with --redact,
# so detected values are not printed in logs or the job summary.
# A manual run (workflow_dispatch) scans the full history; use it occasionally, not on every PR.
# Status check name: "gitleaks".
name: Secret scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists the PR's commits through the GitHub API

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository (full history so the PR commit range resolves)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the scanner version (the action's built-in default is older). Bump deliberately.
          GITLEAKS_VERSION: "8.30.1"
          # No PR comments (would need write permission) and no findings artifact;
          # the redacted job summary is enough to locate a finding.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # GITLEAKS_LICENSE is only required for repositories owned by an organization.
          # This repo is owned by a personal account, so none is needed.
